<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R0 · Logo concepts · Iloilo Transparency</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="mockups.css" />
    <style>
      .logo-grid { display: grid; gap: 2rem; }
      .logo-card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1.5rem; }
      .logo-card h2 { margin: 0 0 1rem; font-size: 1.125rem; }
      .logo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2rem; }
      .favicon-preview { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; font-size: 0.75rem; color: var(--color-secondary); }
      .favicon-preview img { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <main class="page-wrap logo-grid">
      <h1 class="page-title">Logo concepts</h1>
      <p class="lede">Three original marks (no seals or official crests). Full colour and monochrome SVGs in <code>design/logos/</code>.</p>

      <section class="logo-card">
        <h2>1 · Open window</h2>
        <div class="logo-row">
          <img src="logos/window-color.svg" width="96" height="96" alt="Colour window" />
          <img src="logos/window-mono.svg" width="96" height="96" alt="Monochrome window" />
          <div class="favicon-preview"><img src="logos/window-color.svg" width="16" height="16" alt="" />16px</div>
          <div class="favicon-preview"><img src="logos/window-color.svg" width="32" height="32" alt="" />32px</div>
          <div class="favicon-preview"><img src="logos/window-mono.svg" width="16" height="16" alt="" />16px mono</div>
          <div class="favicon-preview"><img src="logos/window-mono.svg" width="32" height="32" alt="" />32px mono</div>
        </div>
      </section>

      <section class="logo-card">
        <h2>2 · Bridge</h2>
        <div class="logo-row">
          <img src="logos/bridge-color.svg" width="96" height="96" alt="Colour bridge" />
          <img src="logos/bridge-mono.svg" width="96" height="96" alt="Monochrome bridge" />
          <div class="favicon-preview"><img src="logos/bridge-color.svg" width="16" height="16" alt="" />16px</div>
          <div class="favicon-preview"><img src="logos/bridge-color.svg" width="32" height="32" alt="" />32px</div>
        </div>
      </section>

      <section class="logo-card">
        <h2>3 · Geometric IT monogram</h2>
        <div class="logo-row">
          <img src="logos/monogram-color.svg" width="96" height="96" alt="Colour IT monogram" />
          <img src="logos/monogram-mono.svg" width="96" height="96" alt="Monochrome IT monogram" />
          <div class="favicon-preview"><img src="logos/monogram-color.svg" width="16" height="16" alt="" />16px</div>
          <div class="favicon-preview"><img src="logos/monogram-color.svg" width="32" height="32" alt="" />32px</div>
        </div>
      </section>

      <p><a href="overview-desktop.html">← Mockups</a></p>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p><a href="mailto:hello@iloilotransparency.info">hello@iloilotransparency.info</a> · corrections</p>
      </div>
    </footer>
  </body>
</html>
